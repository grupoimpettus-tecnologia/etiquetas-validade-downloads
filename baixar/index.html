<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0e0e10">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../painel/icone.png">
  <link rel="apple-touch-icon" href="../painel/icone.png">
  <!-- Tema claro/escuro antes de pintar (o mesmo das páginas do painel). -->
  <script src="../painel/tema.js"></script>
  <link rel="stylesheet" href="../painel/app.css">
  <title>Baixar o Prazzo</title>
</head>
<body class="na-entrada">
  <div class="tema-canto">
    <button class="botao-icone botao-tema" id="btn-tema-entrada" type="button" data-tema-botao title="Tema claro" aria-label="Tema claro"><span class="tema-sol" aria-hidden="true">☀️</span><span class="tema-lua" aria-hidden="true">🌙</span></button>
  </div>
  <main class="tela-login">
    <div class="cartao-login">
      <img class="login-logo" src="../painel/prazzo-negativo.svg" alt="Prazzo">
      <h1>Baixar o Prazzo</h1>
      <p>Para computadores com Windows 10 ou 11.</p>
      <a class="botao-principal" id="link-instalador" href="Prazzo-Setup.exe" download>Baixar o Prazzo</a>
      <p>Os computadores com o app instalado se atualizam sozinhos.</p>
      <p class="nota">Se o Windows avisar "O Windows protegeu o computador", clique em <strong>Mais informações</strong> e depois em <strong>Executar assim mesmo</strong>.</p>
    </div>
  </main>
</body>
</html>
